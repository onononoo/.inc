name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  prepare:
    name: Check tag and create SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: npm run licenses -- --check

      - name: Create the CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application --offline > "inc-${{ steps.version.outputs.version }}.cdx.json"

      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: inc-*.cdx.json
          if-no-files-found: error

  package:
    name: Package (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Allow the Electron sandbox on Linux runners
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: npm ci

      - name: Check hygiene and licenses
        run: |
          npm run check:hygiene
          npm run licenses -- --check

      - name: Package and smoke-test
        if: runner.os != 'Linux'
        run: npm run package -- --zip

      - name: Package and smoke-test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run package -- --zip

      - name: Upload the archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            release/inc-*.zip
            release/inc-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download archives, checksums and SBOM
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        working-directory: artifacts
        run: |
          cat inc-*.zip.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create the release
        working-directory: artifacts
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" ${prerelease} \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            inc-*.zip SHA256SUMS inc-*.cdx.json
