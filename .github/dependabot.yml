version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      typescript-eslint:
        patterns:
          - typescript-eslint
          - '@typescript-eslint/*'
      xterm:
        patterns:
          - '@xterm/*'
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
